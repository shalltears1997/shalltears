# costmap common params for lightROVER
# lightrover_costmap_common_params.yaml

########################################
# 机器人足迹 (四边形)
########################################
footprint: [[0.07, -0.07], [0.07, 0.07], [-0.07, 0.07], [-0.07, -0.07]]

########################################
# Costmap 2D 的插件配置顺序
########################################
plugins:
  - {name: obstacle_layer,       type: "costmap_2d::ObstacleLayer"}
  - {name: edge_obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer,      type: "costmap_2d::InflationLayer"}

########################################
# obstacle_layer (来自激光雷达)
########################################
obstacle_layer:
  enabled: true
  obstacle_range: 0.3
  raytrace_range: 2.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: lidar_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true

########################################
# edge_obstacle_layer (桌面边缘PointCloud)
########################################
edge_obstacle_layer:
  enabled: true

  # 只需要订阅你的点云话题 /edge_obstacle_cloud
  observation_sources: edge_obstacle_cloud
  edge_obstacle_cloud:
    data_type: PointCloud2
    topic: /edge_obstacle_cloud
    marking: true
    clearing: false
    obstacle_persistence: 0.0

########################################
# inflation_layer
########################################
inflation_layer:
  enabled: true
  inflation_radius: 0.2


