# lightrover_local_costmap_params.yaml

local_costmap:
  # 坐标系
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 3.0
  publish_frequency: 3.0
  transform_tolerance: 1.0

  rolling_window: true
  width: 1.5
  height: 1.5
  resolution: 0.05

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: edge_obstacle_layer,type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true

  edge_obstacle_layer:
    enabled: true

  inflation_layer:
    enabled: true



